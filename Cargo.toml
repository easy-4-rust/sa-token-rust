[package]
name = "sa-token-rust"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "A powerful Rust authentication and authorization framework"

[dependencies]
sa-token-core = { version = "0.1.18", path = "./sa-token-core" }
sa-token-storage-memory = { version = "0.1.18", path = "./sa-token-storage/sa-token-storage-memory" }
sa-token-plugin-apikey = { version = "0.1.18", path = "./sa-token-plugin/sa-token-plugin-apikey", optional = true }
sa-token-plugin-jwt = { version = "0.1.18", path = "./sa-token-plugin/sa-token-plugin-jwt", optional = true }
sa-token-plugin-oauth2 = { version = "0.1.18", path = "./sa-token-plugin/sa-token-plugin-oauth2", optional = true }
sa-token-plugin-sso = { version = "0.1.18", path = "./sa-token-plugin/sa-token-plugin-sso", optional = true }
sa-token-plugin-observability = { version = "0.1.18", path = "./sa-token-plugin/sa-token-plugin-observability", optional = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[features]
default = []
plugin-apikey = ["dep:sa-token-plugin-apikey"]
plugin-jwt = ["dep:sa-token-plugin-jwt"]
plugin-oauth2 = ["dep:sa-token-plugin-oauth2"]
plugin-sso = ["dep:sa-token-plugin-sso"]
plugin-observability = ["dep:sa-token-plugin-observability"]
security-plugins = ["plugin-apikey", "plugin-jwt", "plugin-oauth2", "plugin-sso"]

[[example]]
name = "event_listener_example"
path = "sa-token-examples/event_listener_example.rs"

[[example]]
name = "jwt_example"
path = "sa-token-examples/jwt_example.rs"

[[example]]
name = "token_styles_example"
path = "sa-token-examples/token_styles_example.rs"

[[example]]
name = "security_features_example"
path = "sa-token-examples/security_features_example.rs"

[[example]]
name = "oauth2_example"
path = "sa-token-examples/oauth2_example.rs"

[[example]]
name = "websocket_online_example"
path = "sa-token-examples/websocket_online_example.rs"

[[example]]
name = "distributed_session_example"
path = "sa-token-examples/distributed_session_example.rs"

[[example]]
name = "sso_example"
path = "sa-token-examples/sso_example.rs"

[workspace]
members = [
    "sa-token-test/sa-token-integration-tests",
    "sa-token-core",
    "sa-token-adapter",
    "sa-token-macro",
    "sa-token-storage/sa-token-storage-memory",
    "sa-token-storage/sa-token-storage-redis",
    "sa-token-storage/sa-token-storage-database",
    "sa-token-plugin/sa-token-plugin-apikey",
    "sa-token-plugin/sa-token-plugin-jwt",
    "sa-token-plugin/sa-token-plugin-oauth2",
    "sa-token-plugin/sa-token-plugin-sso",
    "sa-token-plugin/sa-token-plugin-observability",
    "sa_token_diagnostics",
    "sa-token-test/sa-token-performance-tests",
    "sa-token-plugin/sa-token-plugin-axum",
    "sa-token-plugin/sa-token-plugin-actix-web",
    "sa-token-plugin/sa-token-plugin-actix-web-core",
    "sa-token-plugin/sa-token-plugin-actix-web-v4",
    "sa-token-plugin/sa-token-plugin-actix-web-v5",
    "sa-token-plugin/sa-token-plugin-rocket",
    "sa-token-plugin/sa-token-plugin-rocket-core",
    "sa-token-plugin/sa-token-plugin-rocket-v05",
    "sa-token-plugin/sa-token-plugin-warp",
    "sa-token-plugin/sa-token-plugin-poem",
    "sa-token-plugin/sa-token-plugin-salvo",
    "sa-token-plugin/sa-token-plugin-salvo-core",
    "sa-token-plugin/sa-token-plugin-salvo-v079",
    "sa-token-plugin/sa-token-plugin-tide",
    "sa-token-plugin/sa-token-plugin-gotham",
    "sa-token-plugin/sa-token-plugin-gotham-core",
    "sa-token-plugin/sa-token-plugin-gotham-v074",
    "sa-token-plugin/sa-token-plugin-ntex",
    "sa-token-plugin/sa-token-plugin-ntex-core",
    "sa-token-plugin/sa-token-plugin-ntex-v212",
    "sa-token-plugin/sa-token-plugin-tonic",
    "sa-token-vernal",
    "sa-token-examples/tonic-full-example",
]

# Examples are excluded from default workspace build to reduce warnings
# To build examples, use: 
#   cargo build -p axum-full-example
#   cargo build -p poem-full-example
#   cargo build -p actix-web-example
#   cargo build -p tonic-full-example
exclude = [
    "sa-token-examples/axum-full-example",
    "sa-token-examples/poem-full-example",
    "sa-token-examples/actix-web-example",
]

resolver = "2"

[workspace.package]
version = "0.1.18"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["金书记"]
readme = "README.md"
repository = "https://github.com/sa-tokens/sa-token-rust.git"
homepage = "https://github.com/sa-tokens/sa-token-rust.git"
documentation = "https://docs.rs/sa-token-rust"
keywords = ["authentication", "authorization", "token", "security", "web"]
categories = ["authentication", "web-programming"]

[workspace.dependencies]
# 核心依赖
tokio = { version = "1.52.3", features = ["full"] }
async-trait = "0.1"
thiserror = "2.0.18"
anyhow = "1.0"

# 序列化
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"

# Token相关
uuid = { version = "1.23.1", features = ["v4", "serde"] }
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }

# 加密
sha2 = "0.11.0"
bcrypt = "0.19.1"
getrandom = "0.3.4"

# 时间处理
chrono = { version = "0.4.44", features = ["serde"] }

# Redis
redis = { version = "1.2.1", features = ["tokio-comp", "connection-manager"] }

# 日志
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
metrics = "0.24.6"
metrics-util = "0.20.4"
tracing-opentelemetry = "0.33.0"
console-subscriber = "0.5.0"
pprof = "0.15.0"
dhat = "0.3.3"
criterion = { version = "0.8.2", features = ["async_tokio"] }
gungraun = "0.19.4"
tikv-jemallocator = "0.7.0"
tikv-jemalloc-ctl = { version = "0.7.0", features = ["stats"] }

# HTTP（通用）
http = "1.4.0"
tower = "0.5.3"

# URL
urlencoding = "2.1.3"

# 正则表达式
regex = "1.12.3"

[patch.crates-io]
sa-token-core = { path = "sa-token-core" }
sa-token-adapter = { path = "sa-token-adapter" }
sa-token-macro = { path = "sa-token-macro" }
sa-token-storage-memory = { path = "sa-token-storage/sa-token-storage-memory" }
sa-token-storage-redis = { path = "sa-token-storage/sa-token-storage-redis" }
sa-token-storage-database = { path = "sa-token-storage/sa-token-storage-database" }
sa-token-plugin-actix-web = { path = "sa-token-plugin/sa-token-plugin-actix-web" }
sa-token-plugin-actix-web-core = { path = "sa-token-plugin/sa-token-plugin-actix-web-core" }
sa-token-plugin-actix-web-v4 = { path = "sa-token-plugin/sa-token-plugin-actix-web-v4" }
sa-token-plugin-actix-web-v5 = { path = "sa-token-plugin/sa-token-plugin-actix-web-v5" }
sa-token-plugin-axum = { path = "sa-token-plugin/sa-token-plugin-axum" }
sa-token-plugin-gotham = { path = "sa-token-plugin/sa-token-plugin-gotham" }
sa-token-plugin-gotham-core = { path = "sa-token-plugin/sa-token-plugin-gotham-core" }
sa-token-plugin-gotham-v074 = { path = "sa-token-plugin/sa-token-plugin-gotham-v074" }
sa-token-plugin-ntex = { path = "sa-token-plugin/sa-token-plugin-ntex" }
sa-token-plugin-ntex-core = { path = "sa-token-plugin/sa-token-plugin-ntex-core" }
sa-token-plugin-ntex-v212 = { path = "sa-token-plugin/sa-token-plugin-ntex-v212" }
sa-token-plugin-poem = { path = "sa-token-plugin/sa-token-plugin-poem" }
sa-token-plugin-rocket = { path = "sa-token-plugin/sa-token-plugin-rocket" }
sa-token-plugin-rocket-core = { path = "sa-token-plugin/sa-token-plugin-rocket-core" }
sa-token-plugin-rocket-v05 = { path = "sa-token-plugin/sa-token-plugin-rocket-v05" }
sa-token-plugin-salvo = { path = "sa-token-plugin/sa-token-plugin-salvo" }
sa-token-plugin-salvo-core = { path = "sa-token-plugin/sa-token-plugin-salvo-core" }
sa-token-plugin-salvo-v079 = { path = "sa-token-plugin/sa-token-plugin-salvo-v079" }
sa-token-plugin-tide = { path = "sa-token-plugin/sa-token-plugin-tide" }
sa-token-plugin-warp = { path = "sa-token-plugin/sa-token-plugin-warp" }
sa-token-plugin-tonic = { path = "sa-token-plugin/sa-token-plugin-tonic" }
sa-token-plugin-apikey = { path = "sa-token-plugin/sa-token-plugin-apikey" }
sa-token-plugin-jwt = { path = "sa-token-plugin/sa-token-plugin-jwt" }
sa-token-plugin-oauth2 = { path = "sa-token-plugin/sa-token-plugin-oauth2" }
sa-token-plugin-sso = { path = "sa-token-plugin/sa-token-plugin-sso" }
sa-token-plugin-observability = { path = "sa-token-plugin/sa-token-plugin-observability" }

[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"
